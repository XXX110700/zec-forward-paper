name: ZEC Bark notification test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Send one explicitly requested test notification
        env:
          BARK_PUSH_URL: ${{ secrets.BARK_PUSH_URL }}
        run: python bark_alerts.py test
