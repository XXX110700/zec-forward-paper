name: ZEC Bark regression checks

on:
  pull_request:
    paths:
      - 'bark_alerts.py'
      - 'zec_v63_github.py'
      - 'index.html'
      - 'news.js'
      - 'analysis.js'
      - 'zec_news.py'
      - 'tests/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_dashboard.cjs
      - run: node tests/test_news.cjs
      - run: node tests/test_analysis.cjs
