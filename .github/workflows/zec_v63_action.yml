name: ZEC V6.3 Forward Paper

on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'

permissions:
  contents: write

concurrency:
  group: zec-v63-forward-paper
  cancel-in-progress: false

jobs:
  run-zec:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Safety regression tests
        run: python -m unittest discover -s tests -v

      - name: Dashboard regression test
        run: node tests/test_dashboard.cjs

      - name: Run ZEC V6.3
        run: python zec_v63_github.py

      - name: Save paper trading state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- zec_v63_paper_state.json zec_v63_trades.csv
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update ZEC V6.3 paper state"
            git push
          fi

      - name: Preserve corrupt state evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zec-state-diagnostics-${{ github.run_id }}
          path: |
            zec_v63_paper_state.json
            zec_v63_paper_state.json.corrupt-*.bak
            zec_v63_trades.csv
          if-no-files-found: ignore
