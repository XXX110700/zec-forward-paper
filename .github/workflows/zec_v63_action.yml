name: ZEC V6.3 Forward Paper

on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'

permissions:
  contents: write

concurrency:
  group: zec-v63-forward-paper
  cancel-in-progress: false

jobs:
  run-zec:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Safety regression tests
        run: python -m unittest discover -s tests -v

      - name: Dashboard regression test
        run: |
          node tests/test_dashboard.cjs
          node tests/test_news.cjs
          node tests/test_analysis.cjs

      - name: Run ZEC V6.3
        run: python zec_v63_github.py

      - name: Save paper trading state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- zec_v63_paper_state.json zec_v63_trades.csv
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update ZEC V6.3 paper state"
            git push
          fi

      # Delivery only follows a successful trading-state push, on default branch.
      - name: Prepare Bark threshold alerts
        id: bark_prepare
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          BARK_PUSH_URL: ${{ secrets.BARK_PUSH_URL }}
        run: python bark_alerts.py prepare

      - name: Persist Bark queue before delivery
        id: bark_checkpoint
        if: steps.bark_prepare.outcome == 'success'
        run: |
          if test -f zec_v63_bark_state.json; then
            git add -- zec_v63_bark_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Checkpoint ZEC Bark alerts"
              git push
            fi
          fi

      - name: Deliver Bark threshold alerts
        id: bark_delivery
        if: steps.bark_checkpoint.outcome == 'success'
        env:
          BARK_PUSH_URL: ${{ secrets.BARK_PUSH_URL }}
        run: python bark_alerts.py deliver

      - name: Save Bark delivery results
        if: always() && (steps.bark_delivery.outcome == 'success' || steps.bark_delivery.outcome == 'failure')
        run: |
          if test -f zec_v63_bark_state.json; then
            git add -- zec_v63_bark_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Save ZEC Bark delivery results"
              git push
            fi
          fi

      - name: Preserve corrupt state evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zec-state-diagnostics-${{ github.run_id }}
          path: |
            zec_v63_paper_state.json
            zec_v63_paper_state.json.corrupt-*.bak
            zec_v63_trades.csv
            zec_v63_bark_state.json
            zec_v63_bark_state.json.corrupt-*.bak
          if-no-files-found: ignore
